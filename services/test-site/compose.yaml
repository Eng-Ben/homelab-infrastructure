# Static test page served by nginx, used to verify the full path
# (Tailscale Serve -> Caddy -> service) before real apps are added.
# Publishes no ports and creates the proxy-test-site network shared only with Caddy.

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    # No published ports: only Caddy can reach this service.
    volumes:
      # Read-only: the container cannot change the site files.
      - ./site:/usr/share/nginx/html:ro
    networks:
      proxy-test-site:
        aliases:
          - test-site
    security_opt:
      - no-new-privileges:true

networks:
  # Shared only with Caddy. Created here, so start this service before the proxy.
  proxy-test-site:
    name: proxy-test-site
